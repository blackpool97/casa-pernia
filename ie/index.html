<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Casa Pernía · Private Chef in Madrid</title>
  <meta name="description" content="Fine dining, Familiar setting. A private chef who cooks a restaurant-level dinner in your home in Madrid." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="Casa Pernía · Fine dining, Familiar setting" />
  <meta property="og:description" content="A private chef in Madrid. Tap to book on WhatsApp." />
  <meta property="og:image" content="https://casapernia.com/images/table-golden-hour.jpg" />
  <link rel="icon" href="../images/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../images/brand/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    /* Canva design, full screen. It updates live whenever the design is edited in Canva. */
    .design {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #000;
      opacity: 0; transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .design.show { opacity: 1; }
    /* Intro: black screen, the Golden P fades in, then everything fades away */
    .intro {
      position: fixed; inset: 0; z-index: 10;
      background: #000; display: grid; place-items: center;
      transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1), visibility 1s;
    }
    .intro.is-done { opacity: 0; visibility: hidden; }
    .intro-mark { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
    .intro-logo { width: clamp(130px, 38vw, 210px); height: auto; opacity: 0; transform: scale(0.94);
      animation: introIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards; }
    .intro-line { width: 0; height: 1px; background: #cdb184; animation: introLine 1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards; }
    .intro-word { font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 0.7rem; letter-spacing: 0.45em; padding-left: 0.45em;
      text-transform: uppercase; color: #9a9184; opacity: 0; animation: introFade 1s ease 1.4s forwards; }
    @keyframes introIn { to { opacity: 1; transform: none; } }
    @keyframes introLine { to { width: 88px; } }
    @keyframes introFade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .intro { display: none; } .design { opacity: 1; } }
  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-mark">
      <img class="intro-logo" src="../images/brand/golden-p.svg" alt="" />
      <div class="intro-line"></div>
      <div class="intro-word">Casa Pernía</div>
    </div>
  </div>

  <iframe class="design" id="design" title="Casa Pernía"
    src="https://www.canva.com/design/DAHaC2zFpnI/Bcv9YjhEd432noXJiqX1zQ/view?embed"
    allow="fullscreen" allowfullscreen loading="eager"></iframe>

  <script>
    (function () {
      var intro = document.getElementById('intro');
      var design = document.getElementById('design');
      var done = function () {
        if (intro.classList.contains('is-done')) return;
        intro.classList.add('is-done');
        design.classList.add('show');
      };
      setTimeout(done, 3000);
      intro.addEventListener('click', done);
    })();
  </script>
</body>
</html>
